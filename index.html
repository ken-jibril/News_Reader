<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>News Reader</title>
  </head>
  <body>

  <div class="flex h-container">

    <!-- Sidebar -->
  <aside class="w-1/5 bg-gray-800 text-white p-4">
      <div class="text-lg font-bold mb-4">Dashboard</div>
    <nav class="space-y-2">
      <a href="#" class="block hover:bg-gray-700 p-2 rounded">home</a>
      <a href="#" class="block hover:bg-gray-700 p-2 rounded">About</a>
      <a href="#" class="block hover:bg-gray-700 p-2 rounded">News</a>
    </nav>
  </aside>
  
  <!-- Main page -->
  <main class="flex-1 bg-gray-100">
    <header class="flex justify-between items-center bg-gray-700 text-white p-4">
      <h1 class="text-xl font-semibold"> News Reader</h1>
      <div>
        <input type="text" id="searchInput" placeholder="Search (news, etc.)" class="p-2 text-black rounded">
        <buttton id="searchBtn" class="bg-blue-500 p-2 rounded">Search</buttton>
      </div>
    </header>

    <section class="p-6 grid grid-cols-3 gap-4" id="newsContainer">
      <!-- News articles will be inserted here -->
    </section>

    <!-- tailwind breakpoints - responsive design -->
  <section class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>


  </main>
  </div> 
  </body>
</html>
